name: Release CLI

on:
  push:
    tags:
      - "cli-v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: brosettlement-api/scripts/go/go.mod
          cache-dependency-path: brosettlement-api/scripts/go/go.sum

      - name: Validate CLI version tag
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#cli-v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag must match cli-vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi

      - name: Test and build release binaries
        shell: bash
        working-directory: brosettlement-api/scripts/go
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#cli-v}"
          package="github.com/BroLabel/brosettlement-agent-skills/brosettlement-api/scripts/go/internal/brocli"
          ldflags="-s -w -X ${package}.Version=${version} -X ${package}.Commit=${GITHUB_SHA}"
          go test ./...
          mkdir -p ../../../dist
          for platform in darwin/amd64 darwin/arm64 linux/amd64 linux/arm64 windows/amd64 windows/arm64; do
            goos="${platform%/*}"
            goarch="${platform#*/}"
            output="../../../dist/brosettlement-${goos}-${goarch}"
            if [[ "$goos" == "windows" ]]; then output="${output}.exe"; fi
            CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" \
              go build -trimpath -ldflags "$ldflags" -o "$output" ./cmd/brosettlement
          done
          cd ../../../dist
          sha256sum brosettlement-* > checksums.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
