name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: brosettlement-api/scripts/go/go.mod
          cache-dependency-path: brosettlement-api/scripts/go/go.sum

      - name: Validate, test, vet, and build
        run: make check

      - name: Test safe skill installation
        run: |
          ./install.sh --target "$RUNNER_TEMP/agent-skills"
          test -f "$RUNNER_TEMP/agent-skills/brosettlement-onboarding/SKILL.md"
          test -f "$RUNNER_TEMP/agent-skills/brosettlement-api/SKILL.md"
