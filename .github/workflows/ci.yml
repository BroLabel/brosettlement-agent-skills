name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: brosettlement-api/scripts/go/go.mod
          cache-dependency-path: brosettlement-api/scripts/go/go.sum

      - name: Validate, test, vet, and build
        run: make check
